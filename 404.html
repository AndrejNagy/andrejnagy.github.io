<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 – Nagy</title>
    <link rel="icon" type="image/x-icon" href="/icon.png">
    <style>
        :root { color-scheme: light dark; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            text-align: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #fff;
            color: #212529;
        }
        h1 { font-size: clamp(64px, 18vw, 160px); margin: 0; line-height: 1; letter-spacing: -.04em; }
        p  { margin: 0; font-size: 18px; opacity: .8; }
        img {
            max-width: min(90vw, 520px);
            height: auto;
            margin: 20px 0;
            border-radius: 12px;
        }
        a {
            display: inline-block;
            margin-top: 8px;
            padding: 10px 20px;
            border-radius: 999px;
            background: #0d6efd;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
        }
        a:hover { background: #0b5ed7; }
        @media (prefers-color-scheme: dark) {
            body { background: #333; color: #f5f5f5; }
        }
    </style>
</head>

<body>
    <h1>404</h1>
    <p>Táto stránka neexistuje.</p>
    <img src="/triggered_nagy_high_res.gif" alt="Triggered Nagy" width="520">
    <a href="/">Späť domov</a>
</body>

</html>
