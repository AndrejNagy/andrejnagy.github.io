<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Retarded Text</title>
    <link rel="shortcut icon" type="image/x-icon" href="./brainlet.ico" />

    <script>
        (function () {
            var mq = window.matchMedia('(prefers-color-scheme: dark)');
            function apply(isDark) {
                document.documentElement.setAttribute('data-bs-theme', isDark ? 'dark' : 'light');
            }
            apply(mq.matches);
            mq.addEventListener('change', function (e) { apply(e.matches); });
        }());
    </script>

    <link rel="stylesheet" href="switch.css">
    <link rel="stylesheet" href="stylesheet.css">
    <!-- https, not http: the page is served over TLS, so an http script is
         blocked as mixed content and none of the JS below would run. -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>

<body>
    <div class="container" style="max-width: 860px;">
        <header class="site-head">
            <h1>Retarded Text</h1>
        </header>

        <div class="panel">
            <label class="rt-label" for="retarded_input">Input</label>
            <textarea class="rt-area" rows="8" onchange="generateRetardedText();" type="text" id="retarded_input"></textarea>

            <label class="rt-label" for="retarded_output">Output</label>
            <textarea class="rt-area" rows="8" readonly id="retarded_output"></textarea>

            <div class="rt-toolbar">
                <button class="btn-accent" onclick="copyToClipboard()">Copy to clipboard</button>
                <label class="f">
                    <span class="switch">
                        <input id="case_change" name="case_change" type="checkbox" checked>
                        <span class="slider round"></span>
                    </span>
                    Random case
                </label>
                <label class="f">
                    <span class="switch">
                        <input id="wrong_y_i" name="wrong_y_i" type="checkbox" checked>
                        <span class="slider round"></span>
                    </span>
                    Wrong y/i
                </label>
            </div>
        </div>
    </div>

    <script src="./retardedtext.js"></script>
</body>

</html>
